name: Release Stable CI

on: workflow_dispatch

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      versionName: ${{ steps.versionname.outputs.versionName }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    # runner.temp is not allowed in job-level env, only in steps.
    - name: Set ANDROID_HOME
      run: |
        echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"

    - name: Cache Android SDK
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/android-sdk
        key: android-sdk-${{ hashFiles('scripts/setup-android-sdk.sh') }}

    - name: Install Android SDK, NDK and CMake
      run: |
        chmod +x gradlew scripts/*.sh
        scripts/setup-android-sdk.sh
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
        echo "$ANDROID_HOME/build-tools/37.0.0" >> "$GITHUB_PATH"

    - name: Get versionName
      id: versionname
      run: echo "versionName=$(grep 'versionName' app/build.gradle.kts | head -1 | awk -F\" '{ print $2 }')" >> $GITHUB_OUTPUT

    - name: Decode Keystore
      uses: timheuer/base64-to-file@v1
      with:
        fileName: 'release_key.jks'
        fileDir: 'app/'
        encodedString: ${{ secrets.SIGNING_KEY }}

    - name: Build Release APK
      run: ./gradlew :cadence:test assembleRelease --stacktrace
      env:
        SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

    - name: Verify native libraries are 16 KB aligned
      run: scripts/check-so-alignment.sh app/build/outputs/apk/release/*.apk

    - name: Verify the APK is signed
      run: apksigner verify --print-certs app/build/outputs/apk/release/*.apk

    - name: Remove the keystore
      if: always()
      run: rm -f app/release_key.jks

    - uses: actions/upload-artifact@v4
      with:
        name: RunningMusic Release
        path: app/build/outputs/apk/release/*.apk

  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RunningMusic Release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Version ${{ needs.build.outputs.versionName }}
          prerelease: false
          tag_name: v${{ needs.build.outputs.versionName }}
          files: |
            ./*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
