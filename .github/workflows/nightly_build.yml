name: Nightly Android Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # runner.temp is not allowed in job-level env, only in steps.
      - name: Set ANDROID_HOME
        run: |
          echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/android-sdk
          key: android-sdk-${{ hashFiles('scripts/setup-android-sdk.sh') }}

      - name: Install Android SDK, NDK and CMake
        run: |
          chmod +x gradlew scripts/*.sh
          scripts/setup-android-sdk.sh
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/37.0.0" >> "$GITHUB_PATH"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Set Run Date
        id: date
        run: echo "RUN_DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Create Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ env.RUN_DATE }}
          name: Nightly Build ${{ env.RUN_DATE }}
          prerelease: true
          files: |
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
